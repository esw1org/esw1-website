<!-- PHOTO CAROUSEL -->
<section class="section-alt">
  <div class="container">
    <div class="section-head left">
      <span class="eyebrow">In His Own Light</span>
      <h2>Tyler in pictures and his family today</h2>
    </div>
    <div class="carousel" data-carousel>
      <button class="carousel-arrow carousel-arrow-prev" aria-label="Previous photo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="carousel-track">
        <div class="carousel-item"><img src="carousel-1.jpeg" alt="Photo 1"><div class="cap">Photo 1</div></div>
        <div class="carousel-item"><img src="carousel-2.jpeg" alt="Photo 2"><div class="cap">Photo 2</div></div>
        <div class="carousel-item"><img src="carousel-3.jpeg" alt="Photo 3"><div class="cap">Photo 3</div></div>
        <div class="carousel-item"><img src="carousel-4.jpeg" alt="Photo 4"><div class="cap">Photo 4</div></div>
        <div class="carousel-item"><img src="carousel-5.jpeg" alt="Photo 5"><div class="cap">Photo 5</div></div>
      </div>
      <button class="carousel-arrow carousel-arrow-next" aria-label="Next photo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
    <div class="carousel-dots" data-carousel-dots></div>
  </div>
</section>
